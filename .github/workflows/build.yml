name: Build View Release

on:
  push:
    branches:
      - master
    tags:
      - 'app-v*'

env:
  VITE_API_URL: https://api.plaza.one

jobs:
  # OTA-deploy
  build-mobile-ota:
    if: startsWith(github.ref_name, 'app-') || github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Crowdin CLI
        run: npm i -g @crowdin/cli

      - name: Pull latest translations
        run: crowdin pull
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set Version Variable
        run: |
          if [[ "${{ github.ref }}" == refs/tags/app-v* ]]; then
            echo "::notice::Production build selected"
            RAW_VERSION=$(echo ${{ github.ref_name }} | sed 's/app-v//')
            echo "IS_DEV=false" >> $GITHUB_ENV
            echo "APP_VERSION=$RAW_VERSION" >> $GITHUB_ENV
            echo "S3_PATH=$RAW_VERSION/build-mobile-$RAW_VERSION.zip" >> $GITHUB_ENV
            echo "::notice::Raw version $RAW_VERSION"
          else
            echo "::notice::Snapshot build selected"
            echo "IS_DEV=true" >> $GITHUB_ENV
            echo "APP_VERSION=snapshot" >> $GITHUB_ENV
            echo "S3_PATH=dev/build-mobile-snapshot.zip" >> $GITHUB_ENV
          fi

      # --- BUILD MOBILE ---
      - name: Build mobile target
        run: |
          rm -rf dist
          VITE_APP=mobile yarn build
          mv dist dist-mobile

      # --- ZIP MOBILE ---
      - name: Zip mobile build
        run: |
          cd dist-mobile
          zip -r ../build-mobile-${{ env.APP_VERSION }}.zip .
          cd ..

      # --- UPLOAD RELEASE TO S3 ---
      - name: Upload to MinIO
        run: |
          aws s3 cp build-mobile-${{ env.APP_VERSION }}.zip \
            s3://${{ env.MINIO_BUCKET }}/${{ env.S3_PATH }} \
            --endpoint-url ${{ env.MINIO_ENDPOINT }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_REGION: us-east-1
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}

      - name: Update version manifest
        if: env.IS_DEV == 'false'
        run: |
          # Get min android version
          MIN_ANDROID=$(jq -r '.min_android_version' version_manifest.json)
          MIN_IOS=$(jq -r '.min_ios_version' version_manifest.json)
          
          ANDROID_MANIFEST="manifest-android.json"
          IOS_MANIFEST="manifest-ios.json"
          
          # Set download url
          DOWNLOAD_URL="${{ env.MINIO_ENDPOINT }}/${{ env.MINIO_BUCKET }}/${{ env.APP_VERSION }}/build-mobile-${{ env.APP_VERSION }}.zip"
          
          # Calculate hash
          FILE_HASH=$(sha256sum build-mobile-${{ env.APP_VERSION }}.zip | awk '{ print $1 }')
          
          # Update Android manifest
          aws s3 cp s3://${{ env.MINIO_BUCKET }}/$ANDROID_MANIFEST ./android.json \
            --endpoint-url ${{ env.MINIO_ENDPOINT }} || echo '{"versions":[]}' > android.json
          
          jq --arg av "$MIN_ANDROID" \
             --arg vv "${{ env.APP_VERSION }}" \
             --arg url "$DOWNLOAD_URL" \
             --arg hash "$FILE_HASH" \
             '(.versions | map(if .min_android == ($av|tonumber) then .view_version = ($vv|tonumber) | .url = $url | .sha256 = $hash else . end)) as $new_list | 
              if ($new_list | any(.min_android == ($av|tonumber))) then .versions = $new_list else .versions += [{"min_android": ($av|tonumber), "view_version": ($vv|tonumber), "url": $url, "sha256": $hash}] end' \
             android.json > new_android.json
          
          aws s3 cp new_android.json s3://${{ env.MINIO_BUCKET }}/$ANDROID_MANIFEST \
            --endpoint-url ${{ env.MINIO_ENDPOINT }}
          
          # Update iOS manifest
          aws s3 cp s3://${{ env.MINIO_BUCKET }}/$IOS_MANIFEST ./ios.json \
            --endpoint-url ${{ env.MINIO_ENDPOINT }} || echo '{"versions":[]}' > ios.json
          
          jq --arg iv "$MIN_IOS" \
             --arg vv "${{ env.APP_VERSION }}" \
             --arg url "$DOWNLOAD_URL" \
             --arg hash "$FILE_HASH" \
             '(.versions | map(if .min_ios == ($iv|tonumber) then .view_version = ($vv|tonumber) | .url = $url | .sha256 = $hash else . end)) as $new_list | 
              if ($new_list | any(.min_ios == ($iv|tonumber))) then .versions = $new_list else .versions += [{"min_ios": ($iv|tonumber), "view_version": ($vv|tonumber), "url": $url, "sha256": $hash}] end' \
             ios.json > new_ios.json
          
          aws s3 cp new_ios.json s3://${{ env.MINIO_BUCKET }}/$IOS_MANIFEST \
            --endpoint-url ${{ env.MINIO_ENDPOINT }}

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_REGION: us-east-1
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
