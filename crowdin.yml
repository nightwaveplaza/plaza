project_id: "893416"
base_path: "."
preserve_hierarchy: true

files:
  - source: src/locales/en.json
    translation: src/locales/%two_letters_code%.json
    dest: "/Nightwave Plaza App/NightwavePlaza.json"

    "languages_mapping": {
      "two_letters_code": {
        "pt-BR": "pt_BR",
        "zh-TW": "zh_Hant"
      }
    }

    ignore:
      - '\Nightwave Plaza Android\**'
      - '\Nightwave Plaza iOS\**'

