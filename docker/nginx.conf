# The $spa_match map is provided by spa-routes.conf (generated at build time)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed assets never change, cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    # Known SPA routes fall back to index.html, everything else is a real 404
    location @spa {
        if ($spa_match) {
            rewrite ^ /index.html last;
        }
        return 404;
    }

    # index.html must not be cached so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
